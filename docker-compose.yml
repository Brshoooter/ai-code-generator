# ═══════════════════════════════════════════════════════════════
#  Docker Compose – mediu local de dezvoltare
#  Pornire:  docker compose up --build
#  Oprire:   docker compose down
# ═══════════════════════════════════════════════════════════════

services:

  # ── Service Discovery ──────────────────────────────────────
  # Trebuie sa porneasca primul, ca restul sa se poata inregistra
  service-discovery:
    build: ./Service_Discovery
    ports:
      - "8500:8500"
    volumes:
      - ./Service_Discovery:/app
    environment:
      - SD_PORT=8500

  # ── API Gateway ────────────────────────────────────────────
  # Poarta de intrare – frontend-ul trimite totul aici
  api-gateway:
    build: ./API_Gateway
    ports:
      - "8080:8080"
    volumes:
      - ./API_Gateway:/app
    environment:
      - GW_SD_URL=http://service-discovery:8500
    depends_on:
      - service-discovery

  # ── Chat Service ───────────────────────────────────────────
  # Genereaza cod via Ollama (LLM local)
  chat-service:
    build: ./Chat_Service
    ports:
      - "8000:8000"
    volumes:
      - ./Chat_Service:/app
    environment:
      - GEN_SD_URL=http://service-discovery:8500
      - GEN_SERVICE_URL=http://chat-service:8000
      - GEN_OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - service-discovery

  # ── PostgreSQL ─────────────────────────────────────────────
  # Baza de date pentru Auth Service
  # Datele persista pe disk chiar daca containerul e oprit/sters
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"             # expus local pentru debug (ex: DBeaver, psql)
    environment:
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=auth_password
      - POSTGRES_DB=auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Authentication Service ─────────────────────────────────
  # JWT cu RS256, bcrypt, PostgreSQL
  auth-service:
    build: ./Authentication_Service
    ports:
      - "8001:8001"
    volumes:
      - ./Authentication_Service:/app
    environment:
      - AUTH_SD_URL=http://service-discovery:8500
      - AUTH_SERVICE_URL=http://auth-service:8001
      - AUTH_DATABASE_URL=postgresql://auth_user:auth_password@postgres:5432/auth_db
    depends_on:
      service-discovery:
        condition: service_started
      postgres:
        condition: service_healthy   # asteapta pana PostgreSQL e gata sa primeasca conexiuni

  # ── Frontend ───────────────────────────────────────────────
  # React + Vite dev server
  frontend:
    build: ./code-gen-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./code-gen-frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway

volumes:
  postgres_data:    # volum named - Docker pastreaza datele intre restart-uri
